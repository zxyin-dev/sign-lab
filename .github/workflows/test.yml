name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 签名双端一致性（Node vs Python，24 组金标准）
        run: python tests/parity_check.py
      - name: 端到端（自建服务端，限流/截断/重放）
        run: python tests/e2e_test.py
